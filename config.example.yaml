# Copy to config.yaml and adjust model names/paths for the local machine.
# This file deliberately keeps model names configurable; no model is baked
# into the Python pipeline.
runtime:
  platform: macos
  workspace: ~/.bookflow
  ollama_url: http://127.0.0.1:11434

models:
  # Recommended by the local Frankenstein Chapter 1 evaluation.
  translation: qwen3.5:latest
  review: qwen3.5:latest

processing:
  target_language: zh-CN
  output_mode: bilingual

pdf:
  engine: marker
  marker_command: .venv/bin/marker_single
  ocr_mode: auto
  # 可选：只处理指定页码范围，例如 "0-7"；留空则处理整本 PDF。
  page_range: null

calibre:
  command: ebook-convert

translation:
  # babelebook is supported when its Rust CLI is installed. ollama is the
  # default native adapter and provides paragraph-level BookFlow caching.
  engine: ollama
  babelebook_command: .tools/bin/babel-ebook
  prompt_version: bookflow-v3-footnotes
  chunk_size: 1200
  concurrency: 1
  # 每次 Ollama 请求失败后的额外重试次数；退避时间按 2x 增长。
  request_retries: 3
  retry_backoff_seconds: 2
  consistency_enabled: true
  term_extraction_enabled: true
  chapter_summary_enabled: true
  context_segments: 2
  context_chars: 3000
  # 每个术语扫描批次的上限；实际会按上下文预算缩小，覆盖全书。
  term_extraction_chars: 18000
  # 留空时由本地模型生成；填写的字段优先于模型判断。
  style: {}
  # 可选的详细术语配置（target、aliases、allowed_variants、meaning）。
  terminology: {}
  parameters:
    temperature: 0.2
    top_p: 0.9
    num_ctx: 8192
    think: false
  glossary:
    Kindle: Kindle

review:
  enabled: true
  chapter_enabled: true
  chapter_chars: 6000
  # 段落审校以外的章节问题修订轮数；恢复任务不会无限重跑。
  book_revision_rounds: 2
  # 兼容旧配置；新的分级轮数由下面两个字段控制。
  max_revision_rounds: 2
  minor_revision_rounds: 2
  serious_revision_rounds: 5
  # 默认非严格模式；需要质量门禁时显式设为 true。
  strict: false
  # 使用结构化 JSON 输出；格式重试时会自动扩大到最多 8192。
  # Also used for whole-paragraph revisions; initial translation has its own budget.
  num_ctx: 16384
  # 普通审校保持快速模式；争议再进入推理核验。
  think: false
  # 仅在审校提出问题时，用模型默认推理模式再次核验证据。
  dispute_enabled: true
  dispute_think: null
  num_predict: 4096

output:
  formats: ["epub"]
  validate_epub: true
  # 未安装或留空仍可生成待审稿，但不会标为已定稿。
  epubcheck_command: epubcheck
